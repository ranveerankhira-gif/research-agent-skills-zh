name: validate

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -X utf8 scripts/validate_repo.py
      - run: python -X utf8 scripts/package_release.py --release all --verify-only
      - run: python -X utf8 -m unittest discover -s scripts/tests -v
      - run: python -X utf8 -m unittest discover -s skills/citation-management/tests -v
      - run: python -X utf8 -m unittest discover -s skills/meta-analysis/tests -v
      - run: python -X utf8 -m unittest discover -s skills/dryad-data-fetcher/tests -v
      - run: python -m compileall -q skills scripts

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - shell: pwsh
        run: python -X utf8 scripts/validate_repo.py
      - shell: pwsh
        run: python -X utf8 scripts/package_release.py --release all --verify-only
      - shell: pwsh
        run: python -X utf8 -m unittest discover -s scripts/tests -v
      - shell: pwsh
        run: python -X utf8 -m unittest discover -s skills/citation-management/tests -v
      - shell: pwsh
        run: python -X utf8 -m unittest discover -s skills/meta-analysis/tests -v
      - shell: pwsh
        run: python -X utf8 -m unittest discover -s skills/dryad-data-fetcher/tests -v
      - shell: pwsh
        run: |
          if (Test-Path skills/academic-literature-search/tests/Test-SearchAcademic.ps1) {
            pwsh -NoProfile -File skills/academic-literature-search/tests/Test-SearchAcademic.ps1
          }
      - shell: pwsh
        run: |
          if (Test-Path skills/research-source-acquisition/tests/Test-GetNbsPublicData.ps1) {
            pwsh -NoProfile -File skills/research-source-acquisition/tests/Test-GetNbsPublicData.ps1
          }
